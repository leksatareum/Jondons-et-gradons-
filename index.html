<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + safe-area : la barre du pouce doit rester au-dessus
         de la barre d'accueil iOS, pas dessous. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121417" />
    <title>Jondons et gradons</title>
    <!-- Icône d'app : celle qu'on voit sur l'écran d'accueil une fois
         « Ajouter à l'écran d'accueil » (iOS et Android), et l'onglet du
         navigateur. Trois tailles suffisent : iOS ne lit que
         apple-touch-icon, Android choisit dans le manifeste. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
